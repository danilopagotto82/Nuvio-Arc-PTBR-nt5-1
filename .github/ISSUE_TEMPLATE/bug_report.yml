name: Bug report
description: Something in Nuvio Arc isn't working the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Nuvio Arc is a one-person hobby project. I read every issue but can't promise a reply or a fix.
        Please don't report problems from this build to the official Nuvio GitHub or Discord.
  - type: input
    id: box
    attributes:
      label: Your box
      placeholder: e.g. Ugoos AM9 Pro, Fire TV Stick 4K Max, Nvidia Shield
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nuvio Arc version
      description: Settings > About
      placeholder: e.g. 1.1.0-nt.5
    validations:
      required: true
  - type: textarea
    id: playing
    attributes:
      label: What were you playing?
      description: The title, and the source type (debrid, Usenet, torrent, Jellyfin, Emby, Silo, plain link). Picture and sound format if you know them (e.g. 4K Dolby Vision, TrueHD Atmos).
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: media
    attributes:
      label: Screenshot or short video
      description: If you can, drop one in here.
